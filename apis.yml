aid: raydiant
name: Raydiant
description: >-
  Raydiant is a digital signage and in-location experience management platform
  for brick-and-mortar businesses, now operating under the Displai brand
  (raydiant.com redirects to displai.ai). The platform lets restaurants, retail
  stores, hospitality venues, commercial buildings, and schools manage branded
  content across networks of screens and kiosks from a central cloud dashboard.
  Core products include Displai Signage (multi-location content management),
  Displai Engage (employee engagement and gamification), Displai InSight (AI foot
  traffic and visitor analytics), and self-service ordering kiosks integrated with
  point-of-sale systems. Customers include Chick-fil-A, Macy's, Toyota, T-Mobile,
  and Red Bull. It runs a production cloud API at api.raydiant.com / api.displai.ai,
  but that surface is not publicly documented — there is no public developer portal,
  OpenAPI specification, SDK, or API reference. Originally added to the API Evangelist
  network as a Bloomberg Beta portfolio lead.
